name: Partner webhook sweep

# Calls the partner webhook sweep route, which sends the partner API's
# interview.completed events that are due: ones that could not go out right away
# (the recording was not ready, the partner was down) and retries, for up to 24
# hours. Safe to run repeatedly.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   PARTNER_WEBHOOK_SWEEP_URL  the production sweep address, for example
#                              https://yourapp.com/api/internal/partner-webhooks/sweep
#   CRON_SECRET                the same value as the CRON_SECRET environment variable
#                              in Vercel (already set for the other sweeps)
#
# GitHub runs scheduled workflows only from the default branch (main), and
# pauses them after 60 days without repository activity.

on:
  schedule:
    # Every 5 minutes, in UTC. GitHub does not run schedules more often than
    # every 5 minutes, and may delay a run when it is busy.
    - cron: "*/5 * * * *"
  # Adds a "Run workflow" button on the Actions tab, for testing by hand.
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the sweep
        env:
          PARTNER_WEBHOOK_SWEEP_URL: ${{ secrets.PARTNER_WEBHOOK_SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$PARTNER_WEBHOOK_SWEEP_URL"
