name: Job-search report sweep

# Calls the sweep route, which queues completed job-search interviews and works
# on one waiting report. See JOB_SEARCH_SWEEP_SCHEDULE.md (Option B).
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SWEEP_URL    the production sweep address, for example
#                https://yourapp.com/api/internal/job-search-reports/sweep
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
#
# GitHub runs scheduled workflows only from the default branch (main), and
# pauses them after 60 days without repository activity.

on:
  schedule:
    # Every 15 minutes, in UTC. GitHub does not run schedules more often than
    # every 5 minutes, and may delay a run when it is busy.
    - cron: "*/15 * * * *"
  # Adds a "Run workflow" button on the Actions tab, for testing by hand.
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    # A report takes a few minutes to produce; this stops a hung run.
    timeout-minutes: 7
    steps:
      - name: Call the sweep
        env:
          SWEEP_URL: ${{ secrets.SWEEP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 330 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$SWEEP_URL"
